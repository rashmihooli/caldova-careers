name: Feature request
description: Suggest an improvement for Caldova Careers
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting an improvement for Caldova Careers.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What candidate, visitor, or maintainer need should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the behavior that would make this complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
